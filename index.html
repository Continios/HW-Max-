<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

    <div class="register-box">
        <h2 id="title">Login | Register</h2>

        <p class="first">Enter your email and password to register.</p>

        <form action="#" method="POST">
            <input type="text" name="username" placeholder="Username" required>

            <input type="email" name="email" placeholder="Enter your email address" required>

            <input type="password" name="password" placeholder="Password" required>

            <input type="password" name="confirm_password" placeholder="Confirm Password" required>

            <button class="register-button" type="submit">Register</button>
        </form>

        <p class="second">Or register with</p>

        <button class="social-button" type="button">
            <img src="./images/google 1.png" width="16" alt="Google">
            Continue with Google
        </button>

        <button class="social-button" type="button">
            <img src="./images/facebook 1.png" width="16" alt="Facebook">
            Continue with Facebook
        </button>
    </div>

</body>
</html>
